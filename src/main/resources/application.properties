spring.application.name=hotel-booking-system

# MySQL Database Connection
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hotel_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
server.port=8080
app.jwt.secret=${JWT_SECRET:dev-only-change-this-jwt-signing-secret-before-production-32bytes}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.security.admin-password=${ADMIN_INITIAL_PASSWORD:admin123}
razorpay.key-id=${RAZORPAY_KEY_ID:test_mode}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:test_mode}
app.payment.gst-rate-percent=${HOTEL_GST_RATE:18}
